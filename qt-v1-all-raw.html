.b-09  { background:rgba(92,157,223,.16); color:var(--blue); }
.b-08  { background:rgba(217,161,59,.15); color:var(--amber); }
.b-0   { background:rgba(224,92,92,.16); color:var(--red); }
.b-oth { background:rgba(139,147,163,.15); color:var(--muted); }
.tag { display:inline-block; padding:1px 8px; border-radius:8px; font-size:11px; margin-left:6px; }
.t-trans { background:rgba(92,157,223,.15); color:var(--blue); }
.t-fix   { background:rgba(217,161,59,.15); color:var(--amber); }
.t-other { background:rgba(139,147,163,.15); color:var(--muted); }
.click { cursor:pointer; }
.click:hover td { background:var(--card2); }
.detail { display:none; }
.detail.open { display:table-row-group; }
.trial-box { background:var(--card2); border:1px solid var(--line); border-radius:6px; padding:12px; margin:8px 0; }
.trial-box h4 { margin:0 0 6px; font-size:13px; }
.chk { font-size:12px; margin:1px 0; }
.chk .s { font-weight:700; margin-right:6px; }
.s-PASS { color:var(--green); } .s-FAIL { color:var(--red); }
.muted { color:var(--muted); font-size:12px; }
.summary-line { font-size:12px; color:var(--muted); margin-top:6px; }
.spark { display:flex; gap:2px; }
.spark i { width:12px; height:12px; border-radius:3px; display:inline-block; }
.vs { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.ag-card { background:var(--card2); border:1px solid var(--line); border-radius:8px; padding:14px; }
.ag-card h3 { margin:0 0 8px; font-size:14px; }
.ag-card .big { font-size:26px; font-weight:700; margin:4px 0; }
.ag-card .muted { font-size:12px; }
.diff-pos { color:var(--green); font-weight:700; }
.diff-neg { color:var(--red); font-weight:700; }
.diff-zero { color:var(--muted); }
.hist { margin-top:10px; font-size:12px; color:var(--muted); }
.hist b { color:var(--txt); }
.filter { margin-bottom:12px; }
.filter button { background:var(--card2); border:1px solid var(--line); color:var(--txt);
  border-radius:6px; padding:4px 12px; margin-right:6px; cursor:pointer; font-size:12px; }
.filter button.on { background:var(--blue); color:#fff; border-color:var(--blue); }
.footer { color:var(--muted); font-size:12px; padding:16px 24px; }

<script>
const DATA = JSON.parse(document.getElementById('payload').textContent);
const AGENTS = DATA.agents || ['bitfun','opencode'];
const TASKS = DATA.tasks || {};
const BATCHES = DATA.batches || {};

document.getElementById('gen-time').textContent = DATA.generated_at;
document.getElementById('page-title').textContent = DATA.job_name + ' agent 对比评测报告';
if (DATA.raw_url)  { const a = document.getElementById('link-raw'); a.href = DATA.raw_url; a.style.display = ''; }
if (DATA.archive_url) { const a = document.getElementById('link-archive'); a.href = DATA.archive_url; a.style.display = ''; }

function badge(r) {
  if (r === null || r === undefined) return '<span class="badge b-oth">-</span>';
  if (r >= 0.995) return `<span class="badge b-1">${r}</span>`;
  if (r >= 0.85)  return `<span class="badge b-09">${r}</span>`;
  if (r >= 0.5)   return `<span class="badge b-08">${r}</span>`;
  if (r === 0)    return '<span class="badge b-0">0.0</span>';
  return `<span class="badge b-08">${r}</span>`;
}
function fmtDur(min) { return min === null || min === undefined ? '-' : min + 'min'; }
function fmtSteps(n) { return n === null || n === undefined ? '-' : n; }
function spark(seq) {
  return `<span class="spark">${seq.map(t => {
    const c = t.reward===null ? '#2a2f3a' : (t.reward>=0.995?'#4caf7d':t.reward>0?'#d9a13b':'#e05c5c');
    return `<i style="background:${c}" title="${t.batch}: ${t.reward}"></i>`;
  }).join('')}</span>`;
}

// ---- agent summary cards ----
function renderSummary() {
  AGENTS.forEach(agent => {
    const bs = BATCHES[agent] || [];
    const full = bs.filter(b => b.n_completed === b.trials.length);
    const lastFull = full[full.length-1];
    const allMeans = bs.map(b=>b.mean).filter(m=>m!==null && m!==undefined);
    const avgAll = allMeans.length ? (allMeans.reduce((a,b)=>a+b,0)/allMeans.length).toFixed(3) : '-';
    const el = document.getElementById('sum-'+agent);
    el.innerHTML = `<h3>${agent}</h3>
      <div class="muted">批次 ${bs.length} · 完整批次 ${full.length}</div>
      <div class="big">${lastFull ? badge(lastFull.mean) : '-'} <span class="muted" style="font-size:13px">最近完整批次均分</span></div>
      <div class="muted">全批次平均 ${avgAll}</div>
      <div class="muted" style="margin-top:6px">${lastFull ? lastFull.name : '（无完整批次）'}</div>`;
  });
}

// ---- task-level compare ----
let tKind = 'all';
function renderTaskFilter() {
  const kinds = [...new Set(Object.values(TASKS).flatMap(h => (h.bitfun||[]).concat(h.opencode||[])).map(x=>x.kind))];
  const el = document.getElementById('t-filter');
  const btns = [['all','全部']].concat(kinds.map(k=>[k,k]));
  el.innerHTML = btns.map(([k,label]) => `<button data-k="${k}" class="${tKind===k?'on':''}">${label}</button>`).join('');
  el.querySelectorAll('button').forEach(b => b.onclick = () => {
    tKind = b.dataset.k;
    el.querySelectorAll('button').forEach(x => x.classList.toggle('on', x===b));
    renderTasks();
  });
}
function renderTasks() {
  const tbody = document.getElementById('task-rows');
  const keys = Object.keys(TASKS).filter(k => {
    if (tKind==='all') return true;
    const all = (TASKS[k].bitfun||[]).concat(TASKS[k].opencode||[]);
    return all.some(x=>x.kind===tKind);
  });
  tbody.innerHTML = keys.map((key, idx) => {
    const h = TASKS[key];
    const bSeq = h.bitfun||[], oSeq = h.opencode||[];
    const bLast = bSeq.length ? bSeq[bSeq.length-1] : null;
    const oLast = oSeq.length ? oSeq[oSeq.length-1] : null;
    const bMean = bSeq.length ? (bSeq.reduce((a,t)=>a+(t.reward??0),0)/bSeq.length).toFixed(3) : '-';
    const oMean = oSeq.length ? (oSeq.reduce((a,t)=>a+(t.reward??0),0)/oSeq.length).toFixed(3) : '-';
    let diff = '-', diffCls = 'diff-zero';
    if (bLast && oLast && bLast.reward!==null && oLast.reward!==null) {
      const d = +(bLast.reward - oLast.reward).toFixed(3);
      diff = d>0?('+'+d):String(d);
      diffCls = d>0?'diff-pos':(d<0?'diff-neg':'diff-zero');
    }
    const kind = (bSeq[0]||oSeq[0]||{}).kind;
    const kindTag = kind ? `<span class="tag ${kind==='trans'?'t-trans':kind==='fix'?'t-fix':'t-other'}">${kind}</span>` : '';
    const short = key.replace(/^qt-v1-/, '').replace(/-trans$|-fix$/, '');
    return `<tr class="click" data-k="${key}">
      <td><b>${short}</b>${kindTag}<div class="muted">${key}</div></td>
      <td>${badge(bLast ? bLast.reward : null)}</td>
      <td>${bSeq.length ? bMean : '-'} ${bSeq.length ? spark(bSeq) : ''}</td>
      <td>${badge(oLast ? oLast.reward : null)}</td>
      <td>${oSeq.length ? oMean : '-'} ${oSeq.length ? spark(oSeq) : ''}</td>
      <td><span class="${diffCls}">${diff}</span></td>
    </tr>
    <tr class="detail" data-detail="${key}"><td colspan="6" style="background:#10131a">
      <div id="tdetail-${idx}"></div>
    </td></tr>`;
  }).join('');
  tbody.querySelectorAll('tr.click').forEach(tr => tr.onclick = () => {
    const k = tr.dataset.k;
    const d = tbody.querySelector(`tr[data-detail="${k}"]`);
    d.classList.toggle('open');
    if (d.classList.contains('open')) renderTaskDetail(k, d.querySelector('div').id);
  });
}
function renderTaskDetail(key, boxId) {
  const box = document.getElementById(boxId);
  if (box.dataset.rendered) return;
  box.dataset.rendered = '1';
  const h = TASKS[key];
  box.innerHTML = AGENTS.map(agent => {
    const seq = h[agent]||[];
    if (!seq.length) return `<div class="trial-box"><h4>${agent}</h4><div class="muted">无记录</div></div>`;
    const rows = seq.map(t => `<tr>
      <td>${t.batch}</td><td>${badge(t.reward)}</td>
      <td>${fmtDur(t.total_minutes)}</td><td>${fmtDur(t.agent_minutes)}</td><td>${fmtSteps(t.steps)}</td>
    </tr>`).join('');
    return `<div class="trial-box">
      <h4>${agent} <span class="muted">(${seq.length} 次)</span></h4>
      <table><thead><tr><th>批次</th><th>得分</th><th>总耗时</th><th>agent耗时</th><th>步数</th></tr></thead>
      <tbody>${rows}</tbody></table>
    </div>`;
  }).join('');
}

// ---- per-agent batch views (reuse pattern from single-agent report) ----
function renderAgentView(agent) {
  const host = document.getElementById('view-'+agent);
  const bs = BATCHES[agent] || [];
  const table = bs.map((b, bi) => {
    const spk = b.trials.slice(0,14).map(t => {
      const c = t.reward===null ? '#2a2f3a' : (t.reward>=0.995?'#4caf7d':t.reward>0?'#d9a13b':'#e05c5c');
      return `<i style="background:${c}" title="${t.name}: ${t.reward}"></i>`;
    }).join('');
    return `<tr class="click" data-bi="${bi}">
      <td><b>${b.name}</b></td>
      <td class="muted">${b.started_at||'-'}</td>
      <td>${badge(b.mean)}</td>
      <td>${b.n_completed ?? b.trials.length}/${b.trials.length}</td>
      <td>${b.n_errored ?? 0}</td>
      <td><span class="spark">${spk}</span></td>
    </tr>
    <tr class="detail" data-detail="${bi}"><td colspan="6" style="background:#10131a"><div id="adetail-${agent}-${bi}"></div></td></tr>`;
  }).join('');
  host.innerHTML = `<div class="card">
    <h2>${agent} 全部批次 (${bs.length})</h2>
    <table><thead><tr><th>批次</th><th>开始时间</th><th>平均分</th><th>完成/总</th><th>错误</th><th>各任务得分</th></tr></thead>
    <tbody>${table}</tbody></table>
  </div>`;
  host.querySelectorAll('tr.click').forEach(tr => tr.onclick = () => {
    const bi = +tr.dataset.bi;
    const d = host.querySelector(`tr[data-detail="${bi}"]`);
    d.classList.toggle('open');
    if (!d.classList.contains('open')) return;
    const box = document.getElementById(`adetail-${agent}-${bi}`);
    if (box.dataset.rendered) return;
    box.dataset.rendered = '1';
    const b = bs[bi];
    box.innerHTML = b.trials.map(t => {
      const v = t.verifier || {checks:[], summary:{}};
      const chks = (v.checks||[]).map(c =>
        `<div class="chk"><span class="s s-${c.status}">[${c.status}]</span>${c.name}</div>`).join('') || '<div class="muted">(无 verifier 明细)</div>';
      return `<div class="trial-box">
        <h4>${t.name} ${badge(t.reward)} <span class="tag ${t.kind==='trans'?'t-trans':t.kind==='fix'?'t-fix':'t-other'}">${t.kind}</span></h4>
        <div class="muted">总耗时 ${fmtDur(t.total_minutes)} · agent 耗时 ${fmtDur(t.agent_minutes)} · 步数 ${fmtSteps(t.steps)}</div>
        <div class="summary-line">非功能 ${v.summary.non_func||'-'} · 功能 ${v.summary.func||'-'}</div>
        <div style="margin-top:8px">${chks}</div>
      </div>`;
    }).join('');
  });
}

// ---- tab switching ----
document.getElementById('tabs').querySelectorAll('button').forEach(btn => {
  btn.onclick = () => {
    document.getElementById('tabs').querySelectorAll('button').forEach(x => x.classList.toggle('on', x===btn));
    const v = btn.dataset.view;
    ['compare','bitfun','opencode'].forEach(vv => {
      document.getElementById('view-'+vv).style.display = vv===v ? '' : 'none';
    });
    if (v==='bitfun' || v==='opencode') {
      const host = document.getElementById('view-'+v);
      if (!host.dataset.rendered) { host.dataset.rendered = '1'; renderAgentView(v); }
    }
  };
});

renderSummary();
renderTaskFilter();
renderTasks();
renderAgentView('bitfun');
renderAgentView('opencode');
</script>
</body>
</html>
