<style>
:root { --bg:#0f1115; --card:#171a21; --card2:#1c2029; --line:#2a2f3a; --txt:#d8dee9;
  --muted:#8b93a3; --green:#4caf7d; --red:#e05c5c; --amber:#d9a13b; --blue:#5c9ddf; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.55 "Segoe UI",system-ui,sans-serif; }
header { padding:20px 24px; border-bottom:1px solid var(--line); background:#13161c; }
header h1 { margin:0 0 4px; font-size:20px; }
header .meta { color:var(--muted); font-size:12px; }
header a { color:var(--blue); text-decoration:none; margin-left:12px; }
header a:hover { text-decoration:underline; }
.wrap { max-width:1240px; margin:0 auto; padding:20px 24px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; }
.card h2 { margin:0 0 4px; font-size:15px; color:#aeb8cc; }
.card .hint { color:var(--muted); font-size:12px; margin-bottom:12px; }
.badge { display:inline-block; min-width:52px; text-align:center; padding:2px 8px; border-radius:10px; font-size:12px; font-weight:600; }
.b-1   { background:rgba(76,175,125,.18); color:var(--green); }
.b-09  { background:rgba(92,157,223,.16); color:var(--blue); }
.b-08  { background:rgba(217,161,59,.15); color:var(--amber); }
.b-0   { background:rgba(224,92,92,.16); color:var(--red); }
.b-oth { background:rgba(139,147,163,.15); color:var(--muted); }
.vs { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
.ag-card { background:var(--card2); border:1px solid var(--line); border-radius:8px; padding:14px; }
.ag-card h3 { margin:0 0 6px; font-size:14px; }
.ag-card .big { font-size:26px; font-weight:700; margin:4px 0; }
.muted { color:var(--muted); font-size:12px; }
.hint-note { color:#6d7688; font-size:11px; }
.trend-toggle { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
.trend-toggle button { background:var(--card2); border:1px solid var(--line); color:var(--muted);
  border-radius:6px; padding:5px 12px; font-size:12px; cursor:pointer; font-family:inherit; }
.trend-toggle button:hover { color:var(--txt); }
.trend-toggle button.on { background:var(--blue); border-color:var(--blue); color:#fff; }
.trend-table { overflow-x:auto; }
.trend-table table { border-collapse:separate; border-spacing:3px; width:100%; }
.trend-table th, .trend-table td { font-size:13px; padding:8px 10px; white-space:nowrap; }
.trend-table th { color:var(--muted); font-weight:600; text-align:right; }
.trend-table th.serie, .trend-table td.serie { text-align:left; font-weight:600; }
.trend-table td { text-align:right; background:#1a1d24; border-radius:4px; color:var(--muted);
  font-variant-numeric:tabular-nums; }
.trend-table td.has { color:var(--txt); }
.trend-table td.best { background:rgba(76,175,125,.18); color:var(--green); font-weight:700; }
.links { display:flex; gap:12px; flex-wrap:wrap; }
.links a { display:inline-block; background:var(--card2); border:1px solid var(--line); color:var(--txt);
  border-radius:6px; padding:9px 16px; text-decoration:none; font-size:13px; }
.links a:hover { border-color:var(--blue); color:var(--blue); }
.footer { color:var(--muted); font-size:12px; padding:16px 24px; }
</style>

<script>
const DATA = JSON.parse(document.getElementById('payload').textContent);
const AGENTS = DATA.agents || ['bitfun','opencode'];
const M = DATA.matrix || {dates:[], tasks:[], cells:{}, date_mean:{}};
const T = DATA.trend || {dates:[], groups:{}};
const TASKS = DATA.tasks || {};

document.getElementById('gen-time').textContent = DATA.generated_at;
document.getElementById('n-tasks').textContent = M.tasks.length;

function badge(r) {
  if (r === null || r === undefined) return '<span class="badge b-oth">-</span>';
  if (r >= 0.995) return `<span class="badge b-1">${r}</span>`;
  if (r >= 0.85)  return `<span class="badge b-09">${r}</span>`;
  if (r >= 0.5)   return `<span class="badge b-08">${r}</span>`;
  if (r === 0)    return '<span class="badge b-0">0.0</span>';
  return `<span class="badge b-08">${r}</span>`;
}

// 系列配色：同一 agent 的类型拆分用同色，靠标签区分，避免同色难辨时另起一套色板
const SERIES_COLOR = {
  'bitfun': '#5c9ddf',
  'opencode': '#4caf7d',
  'trans': '#5c9ddf',
  'fix': '#d9a13b',
  'bitfun·trans': '#5c9ddf',
  'bitfun·fix': '#7fb2e8',
  'opencode·trans': '#4caf7d',
  'opencode·fix': '#8bd0a5',
};
const FALLBACK_COLORS = ['#5c9ddf','#4caf7d','#d9a13b','#c77dbb','#e05c5c'];
function serieColor(key, idx) {
  return SERIES_COLOR[key] || FALLBACK_COLORS[idx % FALLBACK_COLORS.length];
}

function renderSummary() {
  const host = document.getElementById('summary');
  host.innerHTML = AGENTS.map(agent => {
    const bs = DATA.batches[agent] || [];
    const runs = bs.flatMap(b => b.trials).filter(t => t.reward !== null && t.reward !== undefined);
    const avg = runs.length ? (runs.reduce((a,t)=>a+t.reward,0)/runs.length).toFixed(3) : '-';
    const keys = Object.keys(TASKS);
    let perfect = 0;
    keys.forEach(k => {
      const seq = (TASKS[k] && TASKS[k][agent]) || [];
      const last = seq.length ? seq[seq.length-1] : null;
      if (last && last.reward !== null && last.reward >= 0.995) perfect++;
    });
    const dm = M.date_mean[agent] || {};
    const ds = (M.dates||[]).filter(d => dm[d] !== null && dm[d] !== undefined);
    let bestD = null, bestV = null;
    ds.forEach(d => { if (bestV === null || dm[d] > bestV) { bestV = dm[d]; bestD = d; } });
    return `<div class="ag-card">
      <h3>${agent}</h3>
      <div class="big">${avg} <span class="muted" style="font-size:12px">全部运行平均分</span></div>
      <div class="muted">${bs.length} 个批次 · ${runs.length} 次运行</div>
      <div class="muted" style="margin-top:8px">最新一轮满分用例：<b>${perfect}/${keys.length}</b></div>
      <div class="muted">最佳批次日均：<b>${bestV !== null ? bestV : '-'}</b>${bestD ? `（${bestD}）` : ''}</div>
    </div>`;
  }).join('');
}

/* ---------- 得分趋势（按日期聚合的表格） ---------- */

let trendGroup = 'agent';

function renderTrendTable() {
  const dates = T.dates || [];
  const g = (T.groups || {})[trendGroup];
  const host = document.getElementById('trend-table');
  if (!dates.length || !g) { host.innerHTML = '<div class="muted">无数据</div>'; return; }

  const series = g.series.filter(s => s.values.some(v => v !== null && v !== undefined));
  let h = '<table><tr><th class="serie">系列</th>';
  dates.forEach(d => { h += `<th title="${d}">${d.slice(5)}</th>`; });
  h += '</tr>';

  series.forEach((s, si) => {
    const color = serieColor(s.key, si);
    h += `<tr><td class="serie" style="color:${color}">${s.label}</td>`;
    s.values.forEach(v => {
      if (v === null || v === undefined) { h += '<td>-</td>'; return; }
      h += `<td class="${v >= 0.995 ? 'best' : 'has'}">${v.toFixed(3)}</td>`;
    });
    h += '</tr>';
  });
  h += '</table>';
  host.innerHTML = h;
}

function renderTrendToggle() {
  const host = document.getElementById('trend-toggle');
  const groups = T.groups || {};
  const keys = Object.keys(groups);
  host.innerHTML = keys.map(k =>
    `<button data-g="${k}" class="${k === trendGroup ? 'on' : ''}">${groups[k].label}</button>`).join('');
  host.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => { trendGroup = btn.dataset.g; renderTrend(); });
  });
}

function renderTrend() {
  renderTrendToggle();
  renderTrendTable();
}

renderSummary();
renderTrend();
</script>
